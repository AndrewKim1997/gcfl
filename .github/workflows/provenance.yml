name: Source provenance

on:
  push:
  pull_request:

jobs:
  source-extracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check experiment cells against original notebook
        run: python tools/extract_experiments.py --check
